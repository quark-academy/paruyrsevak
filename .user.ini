; ===========================================================================
;  PHP-FPM per-directory settings (timeweb / shared hosting)
; ---------------------------------------------------------------------------
;  short_open_tag выключен намеренно: при short_open_tag=On Blade-компилятор
;  (token_get_all) принимает "<?xml" / "<?" внутри шаблонов за PHP-тег и
;  получается "syntax error, unexpected identifier ..." в
;  storage/framework/views/*.php. Приложение написано под Off.
; ===========================================================================
short_open_tag = Off
